[project]
name = "reelforge"
version = "0.1.0"
description = "Prompt in. Viral short out. AI video studio: script, voice, stock, edit, captions, and official-API publishing to YouTube, TikTok, Instagram and X."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ReelForge" }]
requires-python = ">=3.10"
keywords = ["video", "shorts", "reels", "tiktok", "youtube", "ai-video", "ffmpeg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.25",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
ai = ["google-generativeai>=0.5"]
voice = ["edge-tts>=6.1", "gtts>=2.5"]
captions = ["faster-whisper>=1.0"]
youtube = ["google-api-python-client>=2.0", "google-auth-oauthlib>=1.0"]
x = ["tweepy>=4.14"]
schedule = ["apscheduler>=3.10"]
trends = ["pytrends>=4.9"]
vision = ["torch", "transformers", "pillow"]
mcp = ["mcp<2"]

[project.scripts]
reelforge = "reelforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reelforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
